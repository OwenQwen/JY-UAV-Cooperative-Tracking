# 全局参数
control_frequency: 20
takeoff_altitude: 3.0
default_hold_time: 0.0
position_tolerance: 1.0
vertical_tolerance: 0.6

# 失联保护
lost_connection_timeout: 3.0

# 航点任务列表
waypoints:
  # 飞到指定航点
  - type: waypoint
    north: 0.0          # 北向坐标（米）
    east: 3.0           # 东向坐标（米）
    altitude: 3.0       # 飞行高度（米，正数）
    hold: 3.0           # 到达后悬停时间（秒）

  # - type: waypoint
  #   north: 3.0          # 北向坐标（米）
  #   east: 0.0           # 东向坐标（米）
  #   altitude: 3.0       # 飞行高度（米，正数）
  #   hold: 3.0           # 到达后悬停时间（秒）

  # - type: waypoint
  #   north: 3.0          # 北向坐标（米）
  #   east: 3.0           # 东向坐标（米）
  #   altitude: 3.0       # 飞行高度（米，正数）
  #   hold: 3.0           # 到达后悬停时间（秒）

  - type: rtl
  # 降落
#  - type: land

#===== 目标区域配置（新增） =====
target_areas:
  1:
    center_north: 40.0
    center_east: 0.0
    length_north: 10.0
    width_east: 10.0
    spacing: 5.0
    altitude: 8.0            # 搜索高度（正数，函数内部取负）
    timeout: 60.0
    target_fresh_time: 1.0
    lost_timeout: 2.0
    track_alt_offset: 3.0    # 跟踪时相对目标向上偏移（正数）
  2:
    center_north: -20.0
    center_east: 10.0
    length_north: 25.0
    width_east: 15.0
    spacing: 4.0
    altitude: 8.0
    timeout: 60.0
    target_fresh_time: 1.0
    lost_timeout: 2.0
    track_alt_offset: 3.0

# 话题配置
topics:
  fmu_out:
    vehicle_local_position: /fmu/out/vehicle_local_position
    vehicle_status: /fmu/out/vehicle_status_v1
    vehicle_attitude: /fmu/out/vehicle_attitude   # 新增
    vehicle_command_ack: /fmu/out/vehicle_command_ack
  fmu_in:
    offboard_control_mode: /fmu/in/offboard_control_mode
    trajectory_setpoint: /fmu/in/trajectory_setpoint
    vehicle_command: /fmu/in/vehicle_command
  perception:
    target_pose: /perception/target_pose
  # ===== 新增命令话题 =====
  navigation_command: /navigation_command
  control_target_offset: /control_target_offset